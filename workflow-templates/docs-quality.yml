# Modèle de workflow proposé dans l'onglet « Actions » des dépôts de
# l'organisation. Il délègue au workflow réutilisable de kanibal-studio/.github.

name: Qualité documentaire

on:
  push:
    branches: [$default-branch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
